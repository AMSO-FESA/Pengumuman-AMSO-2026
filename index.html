<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengumuman - AMSO 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #070913;
            --card-bg: rgba(20, 26, 50, 0.65);
            --card-border: rgba(0, 210, 255, 0.2);
            --neon-blue: #00d2ff;
            --neon-purple: #9d4edd;
            --gold: #ffd700;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            overflow-y: scroll;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 210, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(157, 78, 221, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* ================= ANIMASI LATAR BELAKANG SAINS & SPACE ================= */
        .space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0b0f25 0%, #03050a 100%);
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 120px, var(--neon-blue), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 100px 60px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 180px 160px, var(--gold), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 250px 90px, var(--neon-purple), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 250px 250px;
            opacity: 0.45;
            animation: twinkle 4s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        .galaxy-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.18;
            animation: floatBlob 15s infinite alternate ease-in-out;
        }

        .blob-1 { width: 450px; height: 450px; background: var(--neon-blue); top: -5%; left: -10%; }
        .blob-2 { width: 550px; height: 550px; background: var(--neon-purple); bottom: -10%; right: -10%; animation-delay: -5s; }
        .blob-3 { width: 350px; height: 350px; background: var(--gold); top: 40%; right: 20%; animation-delay: -8s; opacity: 0.1; }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 60px) scale(1.15); }
        }

        .floating-icon {
            position: absolute;
            color: var(--neon-blue);
            opacity: 0.5;
            user-select: none;
            filter: drop-shadow(0 0 12px currentColor);
        }

        .el-rocket { top: 22% !important; left: 8% !important; font-size: 2.8rem; color: var(--neon-blue); animation: flyRocket 16s infinite ease-in-out; }
        .el-astronaut-big { top: 58% !important; right: 8% !important; font-size: 4rem !important; color: var(--gold); animation: floatBigAstronaut 14s infinite alternate ease-in-out; opacity: 0.65; }
        .el-astronaut-small { bottom: 18% !important; left: 10% !important; font-size: 2rem; color: var(--neon-purple); animation: floatItem2 10s infinite alternate ease-in-out; opacity: 0.4; }
        
        .el-atom { top: 32% !important; right: 18% !important; font-size: 2.3rem; color: var(--gold); animation: rotateAtom 14s infinite linear; }
        .el-flask { bottom: 25% !important; left: 15% !important; font-size: 2.3rem; color: var(--neon-blue); animation: floatItem1 10s infinite alternate ease-in-out; }
        .el-magnet { top: 65% !important; left: 8% !important; font-size: 2.2rem; color: #ff4757; animation: floatItem2 12s infinite alternate ease-in-out; }
        .el-satellite { top: 15% !important; right: 35% !important; font-size: 2.2rem; color: var(--text-muted); animation: flySatellite 20s infinite linear; }

        .el-math1 { top: 28% !important; left: 22% !important; font-size: 2rem; font-family: 'Orbitron', sans-serif; color: var(--gold); animation: floatItem2 8s infinite alternate ease-in-out; font-weight: 800; }
        .el-math2 { bottom: 35% !important; right: 30% !important; font-size: 2.2rem; font-family: 'Orbitron', sans-serif; color: var(--neon-blue); animation: floatItem1 10s infinite alternate ease-in-out; font-weight: 800; }

        @keyframes flyRocket {
            0% { transform: translate(0, 0) rotate(35deg); }
            50% { transform: translate(-45px, 60px) rotate(30deg); }
            100% { transform: translate(0, 0) rotate(35deg); }
        }

        @keyframes floatBigAstronaut {
            0% { transform: translateY(0) rotate(-5deg) scale(1); }
            100% { transform: translateY(-50px) rotate(10deg) scale(1.05); }
        }

        @keyframes floatItem1 {
            0% { transform: translateY(0) rotate(-12deg); }
            100% { transform: translateY(-45px) rotate(15deg); }
        }

        @keyframes floatItem2 {
            0% { transform: translateY(0) rotate(12deg); }
            100% { transform: translateY(40px) rotate(-15deg); }
        }

        @keyframes rotateAtom {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.15); }
            100% { transform: rotate(360deg) scale(1); }
        }

        @keyframes flySatellite {
            0% { transform: translateX(-35vw) translateY(0) rotate(0deg); }
            100% { transform: translateX(115vw) translateY(-25px) rotate(360deg); }
        }

        /* ================= CONTAINER & HEADER ================= */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
            width: 100%;
        }

        header {
            padding: 30px 0 25px;
            text-align: center;
            position: relative;
        }

        .logo-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .logo-item {
            background: transparent;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            box-shadow: none;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .logo-item:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 12px rgba(0, 210, 255, 0.6));
        }

        .logo-item img {
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.2));
        }

        .logo-item img[src="yasarini.png"], .logo-item img[src*="yasarini.png"] { height: 65px !important; }
        .logo-item img[src="fesa.png"], .logo-item img[src*="fesa.png"] { height: 100px !important; }
        .logo-item img[alt="Logo AMSO"], .logo-item img[src="amso.png"], .logo-item img[src*="amso.png"] { height: 100px !important; }

        /* ================= NAV & DROPDOWN PERSIS HALAMAN UTAMA ================= */
        nav {
            background: rgba(15, 21, 42, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            padding: 8px;
            backdrop-filter: blur(12px);
            display: inline-flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav a:hover, nav a.active {
            color: #fff;
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.3), rgba(157, 78, 221, 0.3));
            border: 1px solid rgba(0, 210, 255, 0.5);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .dropdown {
            position: relative;
            display: inline-flex;
            padding-bottom: 20px; 
            margin-bottom: -20px;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%; 
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 21, 42, 0.95);
            border: 1px solid var(--card-border);
            border-radius: 15px;
            min-width: 190px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            z-index: 100;
            padding: 8px;
            text-align: left;
        }

        /* Bridge hover transparan agar kursor tidak putus */
        .dropdown-content::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 0;
            width: 100%;
            height: 20px;
            background: transparent;
        }

        .dropdown-content a {
            color: var(--text-muted);
            padding: 10px 15px;
            text-decoration: none;
            display: block;
            border-radius: 10px;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .dropdown-content a:hover {
            background: rgba(0, 210, 255, 0.15);
            color: var(--neon-blue);
            border: none;
            box-shadow: none;
            transform: none;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* ================= MAIN CONTENT (HANYA GAMBAR MEDALI BESAR) ================= */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 0 80px;
        }

        .medal-only-display {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .big-medal {
            font-size: clamp(9rem, 22vw, 15rem);
            color: var(--gold);
            filter: drop-shadow(0 0 45px rgba(255, 215, 0, 0.65));
            animation: medalGlow 3.5s infinite alternate ease-in-out;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .big-medal:hover {
            transform: scale(1.12);
            filter: drop-shadow(0 0 70px rgba(255, 215, 0, 0.95));
        }

        @keyframes medalGlow {
            0% {
                transform: scale(1) translateY(0);
                filter: drop-shadow(0 0 35px rgba(255, 215, 0, 0.45));
            }
            100% {
                transform: scale(1.08) translateY(-14px);
                filter: drop-shadow(0 0 65px rgba(255, 215, 0, 0.9));
            }
        }

        /* ================= FOOTER ================= */
        footer {
            background: #050811;
            color: white;
            padding: 35px 20px;
            text-align: center;
            border-top: 1px solid var(--border);
            width: 100%;
        }

        footer strong {
            font-size: 18px;
        }

        footer p {
            margin-top: 7px;
            font-size: 11px;
            opacity: .55;
        }
    </style>
</head>
<body>

    <div class="space-bg">
        <div class="stars"></div>
        <div class="galaxy-blob blob-1"></div>
        <div class="galaxy-blob blob-2"></div>
        <div class="galaxy-blob blob-3"></div>

        <div class="floating-icon el-rocket"><i class="fa-solid fa-rocket"></i></div>
        <div class="floating-icon el-astronaut-big"><i class="fa-solid fa-user-astronaut"></i></div>
        <div class="floating-icon el-astronaut-small"><i class="fa-solid fa-space-shuttle"></i></div>
        <div class="floating-icon el-satellite"><i class="fa-solid fa-satellite"></i></div>

        <div class="floating-icon el-atom" title="Fisika Kuantum/Atom"><i class="fa-solid fa-atom"></i></div>
        <div class="floating-icon el-flask" title="Laboratorium Kimia/Sains"><i class="fa-solid fa-flask-vial"></i></div>
        <div class="floating-icon el-magnet" title="Medan Magnet"><i class="fa-solid fa-magnet"></i></div>

        <div class="floating-icon el-math1">&pi;</div>
        <div class="floating-icon el-math2">&sum;</div>
    </div>

    <!-- ================= HEADER ================= -->
    <div class="container">
        <header>
            <div class="logo-group">
                <div class="logo-item">
                    <img src="https://raw.githubusercontent.com/AMSO-FESA/AMSO-2026/main/yasarini.png" alt="Logo Yasarini" title="Yayasan Ardhya Garini">
                </div>
                <div class="logo-item">
                    <img src="https://raw.githubusercontent.com/AMSO-FESA/AMSO-2026/main/fesa.png" alt="Logo FESA" title="Festival Edukasi Sekolah Angkasa">
                </div>
                <div class="logo-item">
                    <img src="https://raw.githubusercontent.com/AMSO-FESA/AMSO-2026/main/amso.png" alt="Logo AMSO" title="Angkasa Mathematic and Science Olympiad">
                </div>
            </div>

            <!-- NAVBAR -->
            <nav>
                <a href="https://amso-fesa.github.io/AMSO-2026/"><i class="fa-solid fa-house"></i> Beranda</a>
                <a href="https://amso-fesa.github.io/Timeline-AMSO-2026/"><i class="fa-solid fa-calendar-days"></i> Timeline</a>
                <a href="https://amso-fesa.github.io/Kategori-AMSO-2026/"><i class="fa-solid fa-layer-group"></i> Kategori</a>
                <a href="https://amso-fesa.github.io/BukuPanduan-AMSO-2026/"><i class="fa-solid fa-clipboard-check"></i> Buku Panduan</a>
                
                <div class="dropdown">
                    <a href="#"><i class="fa-solid fa-folder-open"></i> Data <i class="fa-solid fa-angle-down" style="font-size: 10px; margin-left: 2px;"></i></a>
                    <div class="dropdown-content">
                        <a href="https://amso-fesa.github.io/Data-Peserta-AMSO-2026/"><i class="fa-solid fa-users" style="margin-right: 6px;"></i> Data Peserta</a>
                        <a href="https://amso-fesa.github.io/Administrasi-AMSO-2026/"><i class="fa-solid fa-envelope-open-text" style="margin-right: 6px;"></i> Administrasi</a>
                    </div>
                </div>

                <a href="#" class="active"><i class="fa-solid fa-trophy"></i> Pengumuman</a>
            </nav>
        </header>
    </div>

    <!-- ================= MAIN CONTENT (HANYA GAMBAR MEDALI BESAR) ================= -->
    <main class="container">
        <div class="medal-only-display">
            <i class="fa-solid fa-medal big-medal" title="Pengumuman AMSO 2026"></i>
        </div>
    </main>

    <!-- ================= FOOTER ================= -->
    <footer>
        <strong>AMSO 2026</strong>
        <p>Angkasa Mathematic & Science Olympiad</p>
    </footer>

</body>
</html>
